<script>
// ---------------------------------------------------------------- slide data
// video: file under ./media (rendered by lecture/manim/render.sh)
const S = [];
const push = (o) => S.push(o);

push({type:"cover", kicker:"60-minute lecture", title:"Attention Is All You Need",
  html:`<div class="authors">Vaswani · Shazeer · Parmar · Uszkoreit · Jones · Gomez · Kaiser · Polosukhin — NeurIPS 2017<br>
  네 개의 막으로 읽는 Transformer: <span class="acc">병목 → 뒤돌아보기 → 도약 → 그 이후</span></div>`,
  notes:`한 문단 요약: 기계는 오랫동안 문장을 열쇠구멍으로 두루마리를 읽듯 한 단어씩 읽었고, 지금까지 본 것을 점점 붐비는 기억 하나에 담아야 했다. 2014년의 attention은 그 독자가 두루마리를 다시 흘끗 볼 수 있게 해 준 목발이었다. 2017년 Google 팀은 무모한 질문을 던졌다. 흘끗 보는 것 자체가 읽기라면? 열쇠구멍을 버리고 모든 단어가 서로를 동시에 보게 하자. 결과는 8개 GPU로 12시간 학습해 모든 번역 시스템을 이겼고, 이후 거의 모든 대형 모델의 청사진이 됐다.`});

push({type:"section", kicker:"Act 1 · 0–8분", title:"병목", sub:"2014년, 문장 하나를 벡터 하나에 담으려던 시절. 두 가지 저주가 설계에서 곧바로 따라 나온다."});

push({kicker:"Act 1", title:"Seq2seq: 문장 전체가 벡터 하나로", video:"A01Funnel",
  html:`<p>"<b>Take the L</b>" — 가져가, 뭐를, L을. 구조는 단순합니다.</p>
  <ul><li>인코더 RNN이 단어를 하나씩 읽으며 <b>같은 크기의 상태 벡터를 덮어씁니다</b>.</li>
  <li>마지막 상태 <span class="f">h_T</span> 하나만 디코더로 넘어갑니다. 중간 상태는 버려집니다.</li>
  <li>긴 문장: <i>L, shortened for loss, is a newly emerging term … and <b>it</b> is used as …</i> — 인코더가 <b>it</b>에 도달했을 때 L, loss, term, community는 이미 열 번 넘게 덮어쓰였습니다.</li></ul>
  <div class="callout">저주 1: 고정 크기 벡터에 덮어쓰기 → 초반 단어 희석<br>저주 2: 한 칸씩 직렬 계산 → 병렬화 불가</div>`,
  notes:`이 문장을 직역하면 뭐가 될까요? "Take the L". 구조만 보면 아주 단순하죠. 2014년에 RNN 인코더-디코더로 신경망 번역이 본격적으로 시작됐을 때 이런 짧은 문장은 쉽게 처리됐습니다. (Take the L은 관용구라 직역은 틀리지만, "구조가 단순하다"는 점만 쓰고 의미는 다음 문장이 설명해 준다고 넘어가세요.)
인코더는 초기 상태 H_0에서 출발해 단어를 하나씩 읽습니다. 단어를 읽을 때마다 같은 크기의 상태 벡터를 새로 덮어씁니다. 마지막 단어까지 읽으면 상태가 하나 남는데, 디코더가 받는 건 이 마지막 벡터 하나뿐입니다. 중간 상태는 전부 버려집니다.
문제는 두 가지입니다. 첫째, 문장이 길어져도 벡터 크기는 그대로인데 매 단어마다 덮어쓰기를 하니까 초반 단어들의 흔적은 희석됩니다. 둘째, 한 단어씩 순서대로 계산해야 하니 병렬화가 안 됩니다. 이 두 가지를 기억해 두세요. 오늘 논문은 이 둘에 대한 답입니다.
긴 문장에서 it은 무엇을 가리킬까요? 이 길이(약 15토큰)에서도 지시 대상이 흔들리기 시작하고, 30–40단어를 넘으면 LSTM도 확실히 무너집니다. Ray Mooney(2014): "You can't cram the meaning of a whole %&!$# sentence into a single $&!#* vector."`});

push({kicker:"Act 1", title:"RNN 셀 안에서는 무슨 일이 일어나는가", video:"A01bInsideCell",
  html:`<p class="f">h_t = tanh( W_x·x_t + W_h·h_{t-1} + b )</p>
  <ul><li>입력 두 개(<span class="q">현재 단어</span>, <span class="k">직전 기억</span>), 출력 하나. 가중치는 <b>한 세트</b>를 모든 시점에 재사용.</li>
  <li>두 항이 <b>같은 슬롯에 더해지므로</b> 어느 숫자가 어느 단어에서 왔는지 분리 불가.</li>
  <li>2차원 장난감 예시: <span class="red">Take</span>의 흔적 0.76 → 0.36 → 0.18, 한 단계마다 반감.</li>
  <li>학습 관점: <span class="f">∂h_t/∂h_{t-1}</span>을 t번 곱해야 하므로 기울기 소실. LSTM 게이트는 완화할 뿐, "벡터 하나·직렬 계산"은 그대로.</li></ul>`,
  notes:`인코더 RNN은 셀 하나입니다. 들어오는 건 두 개, 지금 읽는 단어의 벡터와 바로 직전의 기억 벡터입니다. 셀은 두 개를 각자 행렬로 변환해서 더하고, tanh로 눌러서 새 기억 벡터를 내놓습니다. 이 셀을 단어 수만큼 반복해서 쓰는데, 가중치는 처음부터 끝까지 한 세트입니다.
여기서 두 가지가 결정됩니다. 첫째, 이전 기억과 새 단어가 같은 슬롯에 더해지기 때문에 분리가 안 됩니다. 둘째, 첫 단어의 흔적은 W_h를 마흔 번 통과한 뒤에나 마지막 벡터에 남습니다. 숫자로 따라가 보면 한 단계마다 깎여 나가는 걸 눈으로 볼 수 있습니다.
장난감 계산: W_x = I, W_h = 0.5·I, b = 0. h_1 = tanh([1,0]) ≈ [0.76, 0]; h_2 = tanh([0,1] + 0.5·h_1) ≈ [0.36, 0.76]; h_3 = tanh([1,1] + 0.5·h_2) ≈ [0.83, 0.88].
LSTM: c_t = f_t ⊙ c_{t-1} + i_t ⊙ candidate. forget gate가 1에 가까우면 선택적 유지가 되고 기울기도 비교적 온전히 흐르지만, c_t도 고정 크기 벡터 하나이고 디코더가 받는 것도 마지막 상태 하나이며 계산은 여전히 직렬입니다.`});

push({kicker:"Act 1", title:"정보는 한 번에 한 칸만 이동한다", video:"A02PathLength",
  html:`<ul><li>단어 1의 정보가 단어 n에 닿으려면 <b>n−1번의 상태 갱신</b>을 통과해야 합니다.</li>
  <li>경로가 길수록 신호도, 기울기도 약해집니다.</li>
  <li>그리고 이 계산은 <b>순서대로만</b> 가능합니다. GPU는 대부분 놀고 있습니다.</li></ul>
  <p class="dim">이 카운터를 기억해 두세요. 3막에서 같은 장면을 다시 틀면 카운터가 1에서 멈춥니다.</p>`,
  notes:`직렬 계산의 비용은 두 가지로 나누어 말하세요. (1) 경로 길이: 멀리 있는 단어 사이의 상호작용이 n에 비례하는 단계를 거쳐야 한다. (2) 병렬성: 시간축을 따라 병렬화할 수 없다. Transformer는 둘 다 해결하므로 여기서 분리해 두면 3막에서 회수할 때 효과가 큽니다.`});

push({type:"section", kicker:"Act 2 · 8–15분", title:"뒤돌아보기", sub:"2014–2016. Attention은 RNN에 붙인 목발로 태어났다. 그리고 누군가 위험한 질문을 던졌다."});

push({kicker:"Act 2", title:"Bahdanau 2014: 모든 상태를 남겨 두고 돌아본다", video:"A03Glance",
  html:`<ul><li>마지막 상태만 쓰지 말고 <span class="k">h_1 … h_T</span>를 전부 표처럼 보관.</li>
  <li>디코더가 매 단계 각 행에 점수를 매기고, softmax로 가중치를 만들어 <span class="v">가중합</span>을 읽는다.</li>
  <li>"alignment"라고 불렀고, 지금은 attention이라 부른다. 긴 문장 성능 붕괴가 사라진다.</li>
  <li>Luong 2015: 점수는 단순 <b>내적</b>으로 충분 (행렬곱 하나).</li></ul>
  <div class="callout">그래도 모두가 믿던 것: attention은 <b>RNN에 붙인 패치</b>다. Google의 GNMT(2016)도 8층 LSTM + attention.</div>`,
  notes:`Bahdanau, Cho, Bengio (ICLR 2015). 점수 함수는 작은 feed-forward net("additive attention"). Luong et al. 2015는 디코더-인코더 상태의 내적("multiplicative")이 더 싸고 충분함을 보였다. 여전히 recurrence가 모델이고 attention은 뒤를 흘끗 보는 장치였다. 직렬 계산이라는 저주는 손대지 않았다.`});

push({kicker:"Act 2", title:"흘끗 보기, 매 단계 전부: 학습된 4차원 모델의 실제 숫자", video:"A03bGlanceChain",
  html:`<p>손으로 고른 숫자가 아닙니다. 9개의 영→독 문장 쌍으로 학습한 4차원 모델의 상태와 가중치를 그대로 보여 줍니다.</p>
  <ul><li>위: 인코더 상태 <span class="k">h₁…h₅</span>, 단어마다 하나씩 보관.</li>
  <li>아래: 디코더 상태 <span class="q">s₀ → s₁ → … → s₅</span>. 매 단계 (1) s_{t-1}로 모든 h_j에 점수 → (2) softmax → (3) 문맥 <span class="v">c_t = Σ α_j h_j</span> → (4) <span class="f">s_t = tanh(W_s s_{t-1} + W_y y_{t-1} + W_c c_t)</span> → 단어 출력.</li>
  <li>s는 "지금 어떤 종류의 단어가 필요한가"(문법·위치)를, c는 "소스의 그 자리에 무엇이 있는가"(내용)를 담는다.</li>
  <li><b>bridge 테스트</b>: s₄는 그대로 두고 소스 명사만 바꾸면 α가 bridge로 옮겨 가고 출력이 Brücke로 바뀐다. s 혼자서는 둘을 구분할 수 없다.</li></ul>`,
  notes:`"s가 이미 Straße를 낼 줄 아는데 왜 context가 필요한가?"라는 질문에 대한 답이 이 장면입니다. s_0는 학습된 상수이고(h_T로 초기화하지 않음), 인코더 상태는 단어별 벡터(재귀 없음)라서 소스의 모든 정보는 attention을 통해서만 디코더에 들어옵니다. 그래서 명사를 내는 2단계와 5단계에서 α가 해당 위치에 몰리고, das/überquerte/die처럼 소스를 볼 필요가 없는 단계에서는 α가 퍼집니다. 이것 자체가 교훈입니다: attention은 "내용이 필요할 때만" 날카로워집니다.
모델: lecture/manim/tiny_nmt.py. d=4, 약 230개 파라미터, 수치 미분 + Adam으로 학습, 9/9 정확. 숫자는 lecture/manim/tiny_nmt.json에 저장되어 애니메이션이 그대로 읽습니다.`});

push({kicker:"Act 2", title:"단어 1에서 단어 n까지: 경로 길이 비교", video:"A04ThreeWays",
  html:`<table><tr><th></th><th>층당 연산</th><th>순차 단계</th><th>최대 경로</th></tr>
  <tr><td>RNN</td><td>O(n·d²)</td><td>O(n)</td><td>O(n)</td></tr>
  <tr><td>Conv (k)</td><td>O(k·n·d²)</td><td>O(1)</td><td>O(log_k n)</td></tr>
  <tr><td><span class="acc">Self-attention</span></td><td>O(n²·d)</td><td><b>O(1)</b></td><td><b>O(1)</b></td></tr></table>
  <p>ByteNet(2016), ConvS2S(2017)는 convolution으로 병렬화했지만 먼 단어끼리 만나려면 여전히 여러 층이 필요.</p>
  <div class="callout"><b>위험한 질문</b> (Jakob Uszkoreit): attention이 RNN을 고치는 거라면, RNN을 지우고 attention만 남기면?</div>`,
  notes:`논문 Table 1을 시각화한 장면. Self-attention은 이미 존재했다(Cheng 2016 intra-attention, Parikh 2016, Lin 2017). 항상 다른 것과 함께였을 뿐. 동료 대부분은 실패를 예상했다. 제목은 Llion Jones가 제안한 Beatles 농담. 8명의 저자는 무작위 순서, 모두 동등 기여라는 각주.`});

push({type:"section", kicker:"Act 3 · 15–48분", title:"도약", sub:"Self-attention을 부드러운 사전 검색으로 이해하고, multi-head와 위치 정보, 그리고 블록 전체를 조립한다."});

push({kicker:"Act 3 · self-attention", title:"Attention = 부드러운 검색: 점수 → 정규화 → 혼합", video:"A05SoftLookup",
  html:`<p>모든 토큰이 자기 자신에 대해 세 가지를 씁니다.</p>
  <ul><li><span class="q"><b>query</b></span> q: 나는 무엇을 찾는가?</li><li><span class="k"><b>key</b></span> k: 남이 보기에 나는 무엇을 담고 있는가?</li><li><span class="v"><b>value</b></span> v: 선택되면 무엇을 건네줄 것인가?</li></ul>
  <p class="f">Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V</p>
  <p>예시 (<span class="f">d_k=2</span>): q_sat·k = [1, 1, 2] → /√2 → [0.71, 0.71, 1.41] → softmax → <span class="red">[0.25, 0.25, 0.50]</span> → 출력 = 0.25·v_The + 0.25·v_cat + 0.50·v_sat</p>`,
  notes:`공식을 오른쪽에서 왼쪽으로 세 단계 이야기로 읽으세요. (1) 점수: 모든 query와 모든 key의 내적 — "우리는 얼마나 정렬돼 있나?" (2) 정규화: 행마다 softmax — 점수가 합이 1인 양의 가중치가 된다. (3) 혼합: 가중치 × V — 각 토큰의 새 벡터는 자기가 고른 value들의 혼합. 사전 검색과 같지만 "부드럽다": 정확히 하나가 아니라 모든 항목을 조금씩 받는다. 내적은 투영의 길이(그림자)라는 점을 화살표로 보여 주세요. q = k = x·W 로 모두 같은 입력의 선형 변환이라는 점도 언급.`});

push({kicker:"Act 3 · self-attention", title:"왜 √d_k로 나누는가", video:"A06WhySqrt",
  html:`<ul><li>단위 분산 벡터 두 개의 내적은 분산이 <b>d_k</b>. d_k=64면 폭이 8배.</li>
  <li>큰 점수는 softmax를 거의 one-hot 스파이크로 만들고, 그 지점의 기울기는 ≈ 0. 학습이 멈춘다.</li>
  <li>√d_k로 나누면 폭이 어떤 d_k에서도 1로 고정된다.</li></ul>
  <p class="dim">논문: additive attention이 <i>scaling 없는</i> dot-product를 큰 d_k에서 이겼다. 나누기 하나로 격차를 메우고 행렬곱의 속도는 그대로.</p>`,
  notes:`softmax의 야코비안은 p_i(δ_ij − p_j). 하나의 p가 1에 가까우면 모든 항이 0에 가깝다. 히스토그램이 넓어질수록 한 행에서 최대값과 나머지의 차이가 커져 spike가 생긴다는 흐름으로 설명.`});

push({kicker:"Act 3 · self-attention", title:"같은 계산을 행렬로: QKᵀ → 행 softmax → ×V", video:"A07MatrixView",
  html:`<ul><li><span class="q">Q</span>의 한 행 · <span class="k">Kᵀ</span>의 한 열 = 점수 격자의 한 칸.</li>
  <li>격자의 각 행을 softmax → 행 합이 1.00인 heat map. 이것이 논문 부록의 "attention map".</li>
  <li>heat map의 각 행이 <span class="v">V</span>의 행들을 섞어 출력 한 행을 만든다.</li>
  <li>격자를 문장 위에 겹치면 단어↔단어 연결선이 된다: 논문 그림에서 <b>it</b>이 <b>animal</b>을 켠다.</li></ul>`,
  notes:`3토큰 예시를 A5, A7, A9, A11에서 반복해 청중이 데이터를 다시 배우지 않게 합니다. 행 합 1.00을 항상 띄워 "가중치는 예산"이라는 감각을 심으세요.`});

push({kicker:"Act 3 · multi-head", title:"Multi-head: 폭을 쪼개 8개의 검색을 병렬로", video:"A08MultiHead",
  html:`<p>attention 패턴 하나 = 관계 하나. 그런데 단어는 "주어는 누구?", "나를 꾸미는 건?", "내가 가리키는 건?"을 동시에 묻고 싶다. 하나의 softmax로 평균 내면 모두 흐려진다.</p>
  <ul><li>h = 8개의 작은 W_i^Q, W_i^K, W_i^V 로 512 → 64 차원씩 투영, 각자 attention.</li>
  <li>8개의 64차원 출력을 이어붙여(512) W^O로 섞는다.</li>
  <li><b>비용은 512차원 head 하나와 같다.</b> 폭을 나눈 것이지 곱한 것이 아니다.</li></ul>
  <p class="f">MultiHead = Concat(head_1…head_8)·W^O</p>`,
  notes:`부록 그림: coreference를 따라가는 head(its → Law), 지역 구문을 보는 head, 거의 대각선인 head. Table 3: head 1개는 0.9 BLEU 나쁘고, 32개도 나쁘다 — 너무 작은 head는 용량을 잃는다.`});

push({kicker:"Act 3 · position", title:"Attention만으로는 단어 주머니(bag of words)", video:"A09ShuffleTest",
  html:`<ul><li>attention 공식에는 토큰이 <b>어디</b> 있는지에 대한 정보가 없다.</li>
  <li>입력 행을 섞으면 출력 행도 똑같이 섞일 뿐. "dog bites man" = "man bites dog".</li>
  <li>해결: 첫 층 전에 각 임베딩에 <span class="pos">위치 벡터</span>를 더한다.</li></ul>`,
  notes:`아무도 미리 말해 주지 않다가 뒤늦게 깨닫는 함정으로 연출하면 좋습니다. permutation equivariance라는 용어를 쓰되, 그림으로는 "같은 색 상자들이 자리만 바뀜"으로 충분합니다.`});

push({kicker:"Act 3 · position", title:"사인파 위치: 속도가 다른 시계들", video:"A10Sinusoids",
  html:`<p class="f">PE(pos,2i) = sin(pos/10000^{2i/d}),  PE(pos,2i+1) = cos(…)</p>
  <ul><li>차원 쌍 하나 = 자기 속도로 도는 시계 바늘. 앞쪽 차원은 빠르게(세밀한 위치), 뒤쪽은 느리게(거친 위치). 이진수 세기의 부드러운 버전.</li>
  <li>pos → pos+k 는 각 (sin, cos) 쌍의 <b>고정 각도 회전</b>. 선형층이 "3칸 뒤를 봐"를 배울 수 있다.</li>
  <li>학습 가능한 위치 임베딩과 BLEU 거의 동일 (Table 3, row E).</li></ul>`,
  notes:`선택 이유 두 가지: 상대 위치가 선형 함수(회전)로 표현됨, 학습보다 긴 길이로 외삽 가능하리라는 기대. 이후 RoPE가 이 "회전" 아이디어를 q·k 내적 안으로 옮겼다는 점은 4막에서.`});

push({kicker:"Act 3 · decoder", title:"디코더 self-attention: 미래를 가린다", video:"A11Mask",
  html:`<ul><li>softmax 전에 미래 위치 점수를 <span class="red">−∞</span>로. softmax 뒤 가중치는 정확히 0.</li>
  <li>첫 행은 자기 자신만, 마지막 행은 지금까지 전부.</li>
  <li>덕분에 target 전체를 <b>한 번의 병렬 패스</b>로 학습하면서도 왼쪽→오른쪽 생성처럼 행동한다.</li></ul>`,
  notes:`"teacher forcing + mask = 병렬 학습"이 핵심. 추론 시에는 토큰 하나씩 생성하며 매번 디코더를 다시 돌린다(KV cache는 후대의 최적화).`});

push({kicker:"Act 3 · block", title:"Residual 고속도로와 LayerNorm, 그리고 FFN", video:"A12Residual",
  html:`<p>Encoder layer (×6): <span class="f">x → MultiHeadSelfAttn → add&amp;norm → FFN → add&amp;norm</span></p>
  <ul><li><b>FFN</b>: <span class="f">max(0, xW₁+b₁)W₂+b₂</span>, 512 → 2048 → 512, 토큰마다 독립. attention이 <i>모아 오면</i> FFN이 <i>생각한다</i>.</li>
  <li><b>Residual</b>: <span class="f">x + Sublayer(x)</span>. 6층을 곧장 통과하는 고속도로.</li>
  <li><b>LayerNorm</b>: 토큰 벡터를 재중심·재척도. (논문은 post-norm, 현대 모델은 pre-norm.)</li></ul>`,
  notes:`Decoder layer는 세 sublayer: masked self-attn → cross-attn(Q는 디코더, K·V는 인코더 출력) → FFN. 입력·출력 임베딩과 softmax 가중치 공유, 임베딩에 √d_model 곱함. base: d_model 512, h 8, d_ff 2048, N 6, dropout 0.1, 65M. big: 1024/16/4096, dropout 0.3, 213M.`});

push({kicker:"Act 3 · block", title:"전체 기계: encoder, decoder, cross-attention", video:"A13FullFlow",
  html:`<ul><li>소스 토큰이 encoder 6층을 오른다.</li>
  <li>target 토큰이 decoder 6층을 오르며, 각 층의 <span class="v">cross-attention</span>이 encoder 최종 출력의 K·V를 끌어온다. Bahdanau의 "흘끗 보기"가 같은 부품으로 다시 만들어졌다.</li>
  <li>linear + softmax로 토큰 하나를 내고, 그것을 다시 decoder 입력 끝에 붙여 반복.</li></ul>`,
  notes:`논문 Figure 1을 조각조각 쌓는 장면. 여기서 1막의 카운터 장면을 다시 틀고 "1에서 멈춘다"고 말하면 이야기가 닫힙니다.`});

push({kicker:"Act 3b · 증명", title:"학습 레시피와 결과",
  html:`<div class="two"><div><h2>레시피</h2><ul>

push({kicker:"Act 3b · 증명", title:"층당 비용: n²·d 대 n·d²", video:"A14Complexity",
  html:`<ul><li>self-attention은 <span class="red">n×n</span> 격자에 깊이 d, recurrence는 <span class="q">n×d</span> 사각형에 깊이 d.</li>
  <li>n &lt; d(=512)인 동안은 attention이 더 싸다. 그 뒤로는 n² 격자가 O(1) 경로 길이의 대가.</li>
  <li>논문이 스스로 밝힌 유일한 진짜 한계. 10년간의 "efficient attention" 연구는 이 문장의 각주다.</li></ul>`,
  notes:`Table 1의 첫 열. 당시 문장 길이는 수십 토큰이라 n ≪ d였고, 논문은 restricted attention(이웃 r개만)도 제안했지만 쓰지 않았다.`});

push({kicker:"Act 3b · 증명", title:"학습률: 4000 step 워밍업 후 1/√step 감쇠", video:"A15Warmup",
  html:`<p class="f">lr = d_model^{-0.5} · min(step^{-0.5}, step·warmup^{-1.5})</p>
  <ul><li>처음엔 선형으로 올리고, 이후 역제곱근으로 내린다.</li>
  <li>post-norm Transformer는 워밍업 없이는 불안정하다. 이 스케줄은 이후 거의 모든 Transformer 학습의 기본값이 됐다.</li></ul>`,

push({kicker:"Act 3b · 증명", title:"Ablation (Table 3): 저자들이 배운 것",

// ---------------------------------------------------------------- engine
const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.type || "content");
  if (s.type === "cover") {
    el.innerHTML = `<div class="kicker">${s.kicker||""}</div><h1>${s.title}</h1>${s.html||""}`;
  } else if (s.type === "section") {
    el.innerHTML = `<div class="kicker">${s.kicker||""}</div><h1>${s.title}</h1><div class="sub">${s.sub||""}</div>`;
  } else {
    const media = s.video
      ? `<div class="media"><video muted playsinline preload="metadata" src="media/${s.video}.mp4" title="${s.video} — click to replay"></video></div>`
      : "";
    el.innerHTML = `<div class="kicker">${s.kicker||""}</div><h2>${s.title}</h2>
      <div class="body ${s.video ? "" : "noscript"}">${media}<div class="script">${s.html||""}</div></div>`;
  }
  deck.appendChild(el);
});
const slides = [...document.querySelectorAll(".slide")];
let cur = -1, loop = false;
const notes = document.getElementById("notes"), notesBody = document.getElementById("notesBody");
const counter = document.getElementById("counter"), bar = document.getElementById("bar");

function show(i, replay = true) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  if (cur >= 0) { slides[cur].classList.remove("active"); const v = slides[cur].querySelector("video"); if (v) v.pause(); }
  cur = i;
  slides[cur].classList.add("active");
  const v = slides[cur].querySelector("video");
  if (v && replay) { v.loop = loop; v.currentTime = 0; v.play().catch(() => {}); }
  notesBody.innerHTML = (S[cur].notes || "").split(/\n+/).map(p => `<p>${p}</p>`).join("");
  counter.textContent = `${cur + 1} / ${slides.length}`;
  bar.style.width = `${(cur + 1) / slides.length * 100}%`;
  history.replaceState(null, "", `#${cur + 1}`);
}
function replay() { const v = slides[cur].querySelector("video"); if (v) { v.currentTime = 0; v.play().catch(() => {}); } }
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key.toLowerCase() === "r") replay();
  else if (e.key.toLowerCase() === "n") notes.classList.toggle("show");
  else if (e.key.toLowerCase() === "l") toggleLoop();
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
deck.addEventListener("click", e => { if (e.target.tagName === "VIDEO") replay(); });
document.querySelectorAll("video").forEach(v => v.addEventListener("error", () => {
  const ph = document.createElement("div"); ph.className = "ph";
  ph.textContent = `영상 없음: ${v.getAttribute("src")} — lecture/manim/render.sh 를 실행해 생성하세요`;
  v.replaceWith(ph);
}));
function toggleLoop() { loop = !loop; document.getElementById("loopBtn").classList.toggle("on", loop); const v = slides[cur].querySelector("video"); if (v) v.loop = loop; }
document.getElementById("loopBtn").onclick = toggleLoop;
document.getElementById("notesBtn").onclick = () => notes.classList.toggle("show");
let tx = null;
document.addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
document.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); tx = null; });
show(parseInt(location.hash.slice(1) || "1", 10) - 1);
window.addEventListener("hashchange", () => show(parseInt(location.hash.slice(1) || "1", 10) - 1));
</script>
</body>
