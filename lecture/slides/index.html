<script>
const ALIGN = {"A": [[0.22792182609392167, 0.14009977832259513, 0.39145283253551266, 0.22792182609392167, 0.012603736954048804], [0.0006934511671618324, 0.9966920384598472, 0.0014916842154295252, 0.0006934511671618324, 0.0004293749903995221], [0.4423208278970158, 0.008642519518943705, 0.03231271271338868, 0.4423208278970158, 0.07440311197363583], [0.47169673898389236, 9.193744219093967e-06, 0.01917790639704404, 0.47169673898389236, 0.0374194218909521], [0.003140369361642876, 3.6646927969754486e-05, 0.0022482008753520063, 0.003140369361642876, 0.9914344134733926]], "B": [[0.22804574177724865, 0.1401759472444677, 0.39166565614291005, 0.22804574177724865, 0.012066913058124983], [0.0006798804572193907, 0.997133560135386, 0.0014763115082927062, 0.0006798804572193907, 3.0367441882403693e-05], [0.11933254194291443, 0.00233172627680667, 0.008717560600584102, 0.11933254194291443, 0.7502856292367804], [0.012004422434406723, 2.0363630735136138e-07, 0.0004654729598860125, 0.012004422434406723, 0.9755254785349932], [0.0011865899524909239, 1.3600936070526336e-05, 0.0008471307389605333, 0.0011865899524909239, 0.996766088419987]], "src": ["the", "animal", "crossed", "the", "street"], "srcAlt": ["the", "animal", "crossed", "the", "bridge"], "tgt": ["das", "tier", "\u00fcberquerte", "die", "stra\u00dfe"], "tgtAlt": ["das", "tier", "\u00fcberquerte", "die", "br\u00fccke"]};
FIG.alignmentSvg = FIG.alignment(ALIGN.A, ALIGN.B, ALIGN.src, ALIGN.srcAlt, ALIGN.tgt, ALIGN.tgtAlt);
// ---------------------------------------------------------------- slide data
const S = [];
const push = (o) => S.push(o);
const setup = (kicker, title, bullets, watch) => push({type:"setup", kicker: kicker + " · setup", title, bullets, watch});

push({type:"cover", kicker:"60-minute lecture", title:"Attention Is All You Need",
  html:`<div class="authors">Vaswani · Shazeer · Parmar · Uszkoreit · Jones · Gomez · Kaiser · Polosukhin — NeurIPS 2017<br>
  The Transformer in four acts: <span class="acc">the bottleneck → the glance → the leap → the aftermath</span></div>`});

push({type:"section", kicker:"Act 1 · 0–8 min", title:"The bottleneck", sub:"2014: a whole sentence squeezed into one vector. Two curses follow directly from the design."});

setup("Act 1", "A 2014 translator: squeeze the sentence into one vector", [
  "An encoder RNN reads the words <b>one at a time</b> and <b>overwrites</b> a fixed-size state vector",
  "Only the last state <span class='f'>h_T</span> is handed to the decoder; the intermediate states are thrown away",
  "The decoder unrolls that single vector into the target sentence",
  "Short sentences are fine. The trouble starts as they get longer"],
 ["Three words sliding into the box", "In the long sentence, the early words <b>fading</b> inside the box", "The decoder pulling out <b>?</b> where the early words used to be"]);
push({kicker:"Act 1", title:"Seq2seq: the whole sentence becomes one vector", video:"A01Funnel",
  html:`<p>"<b>Take the L</b>" is structurally trivial: three words, in order.</p>
  <ul><li>The encoder RNN reads one word at a time and <b>overwrites the same fixed-size state vector</b>.</li>
  <li>Only the last state <span class="f">h_T</span> reaches the decoder. Intermediate states are discarded.</li>
  <li>Long sentence: <i>L, shortened for loss, is a newly emerging term … and <b>it</b> is used as …</i> — by the time the encoder reaches <b>it</b>, the words L, loss, term, community have been overwritten more than ten times.</li></ul>
  <div class="callout">Curse 1: overwriting a fixed-size vector → early words fade<br>Curse 2: strictly sequential steps → no parallelism</div>`});

setup("Act 1", "Inside one RNN cell", [
  "<span class='f'>h_t = tanh(W_x·x_t + W_h·h_{t-1} + b)</span>",
  "Two inputs, <span class='q'>the current word</span> and <span class='k'>the previous memory</span>; one output, the new memory",
  "The two terms are <b>added into the same slots</b> → you can no longer tell which number came from which word",
  "One set of weights, reused once per word"],
 ["The wiring of one cell: two matrices → + → tanh", "The output looping back as the next cell's input", "In the 2-D example, the trace of 'Take' goes <b>0.76 → 0.36 → 0.18</b>, halving each step"]);
push({kicker:"Act 1", title:"What happens inside the RNN cell", video:"A01bInsideCell",
  html:`<p class="f">h_t = tanh( W_x·x_t + W_h·h_{t-1} + b )</p>
  <ul><li>Two inputs (<span class="q">current word</span>, <span class="k">previous memory</span>), one output. <b>One</b> weight set reused at every step.</li>
  <li>Both terms land in the <b>same slots</b>, so nothing can say which number came from which word.</li>
  <li>2-D toy run: the trace of <span class="red">Take</span> goes 0.76 → 0.36 → 0.18, halving each step.</li>
  <li>Training view: <span class="f">∂h_t/∂h_{t-1}</span> is multiplied t times → vanishing gradients. LSTM gates soften this; "one vector, sequential steps" stays.</li></ul>`});

setup("Act 1", "Name the two curses", [
  "<b>Curse 1 · dilution</b>: overwriting a fixed-size vector → early words disappear",
  "<b>Curse 2 · sequential</b>: word 5 cannot be processed until word 4 is done → no parallelism",
  "Information from word 1 reaches word n only after <b>n−1</b> updates",
  "These are separate problems. The paper fixes both"],
 ["A pulse moving one node at a time, with a <b>counter</b>", "The counter stops at 7. In Act 3 the same scene stops at <b>1</b>"]);
push({kicker:"Act 1", title:"Information moves one hop per step", video:"A02PathLength",
  html:`<ul><li>Information from word 1 must pass through <b>n−1 state updates</b> to reach word n.</li>
  <li>The longer the path, the weaker the signal and the gradient.</li>
  <li>And the computation is <b>strictly in order</b>. The GPU mostly idles.</li></ul>
  <p class="dim">Remember this counter. In Act 3 the same scene is replayed and it stops at 1.</p>`});

push({type:"section", kicker:"Act 2 · 8–15 min", title:"The glance", sub:"2014–2016. Attention was born as a crutch for RNNs. Then someone asked a dangerous question."});

push({kicker:"Act 2", title:"2013–2020: attention was born as a crutch", fig:"timeline",
  html:`<ul><li>2013–14: neural machine translation begins; the sentence is compressed into one vector.</li>
  <li>2014–15: <span class="k">attention</span> appears as an add-on to the RNN. Bahdanau scores with a small network, Luong with a dot product.</li>
  <li>2016–17: GNMT ships LSTM + attention; ByteNet and ConvS2S try convolutions for parallelism.</li>
  <li><span class="acc">June 2017</span>: the paper that keeps only the crutch and drops the RNN.</li></ul>`});

push({kicker:"Act 1 → Act 2", title:"One vector versus a table", fig:"bottleneck",
  html:`<p>Left is Act 1, right is Act 2. Exactly one thing changed: <b>whether the intermediate states are kept</b>.</p>
  <ul><li>Keep them and memory grows with sentence length. There is no fixed box.</li>
  <li>The decoder re-reads the table at every step, so any source word reaches it through one weighted edge.</li>
  <li>Dashed-line thickness is the softmax weight. The weights always sum to 1.00.</li></ul>`});

setup("Act 2", "Bahdanau 2014: stop throwing the states away", [
  "Keep <b>every</b> encoder state <span class='k'>h_1 … h_T</span> as a table",
  "For each output word: score every row → softmax → <b>weighted sum</b> = the context",
  "Curse 1 is lifted: memory scales with the sentence, and any word is one hop away",
  "Luong 2015: a plain dot product is enough for the score"],
 ["<b>Dashed lines</b> from the decoder to the five encoder states; thickness = weight", "Weights summing to <b>1.00</b>", "The states shrinking and merging into one <span class='v'>context</span> vector"]);
push({kicker:"Act 2", title:"Bahdanau 2014: keep every state and look back", video:"A03Glance",
  html:`<ul><li>Keep <span class="k">h_1 … h_T</span> as a table instead of using only the last state.</li>
  <li>At each decoding step the decoder scores every row, turns the scores into softmax weights, and reads the <span class="v">weighted sum</span>.</li>
  <li>They called it "alignment"; we call it attention. The collapse on long sentences disappears.</li>
  <li>Luong 2015: a plain <b>dot product</b> is enough for the score (one matrix multiply).</li></ul>
  <div class="callout">What everyone still believed: attention is a <b>patch bolted onto an RNN</b>. Google's GNMT (2016) was 8 LSTM layers + attention.</div>`});

setup("Act 2", "Now follow every step with real numbers", [
  "Not hand-picked numbers: the values of a <b>4-dimensional model we actually trained</b>",
  "Four operations per step: ① <span class='k'>score</span> ② softmax ③ <span class='v'>context</span> ④ new state <span class='q'>s_t</span>",
  "<span class='f'>s_t = tanh(W_s·s_{t-1} + W_y·y_{t-1} + W_c·c_t + b)</span> — the Act 1 cell with <b>one extra input</b> (the context)",
  "s carries 'what kind of word is needed' (grammar, position); c carries 'what the source has at that spot' (content)"],
 ["Step 1 runs slowly, steps 2–5 faster", "Only steps 2 and 5 put their weight <b>on a single word</b>", "The <b>bridge test</b> at the end: same s_4, swap the source noun, the output becomes Brücke"]);
push({kicker:"Act 2", title:"The glance, every step: a trained 4-dim model, real numbers", video:"A03bGlanceChain",
  html:`<p>Nothing here is hand-picked. These are the states and weights of a 4-dimensional model trained on nine English→German pairs.</p>
  <ul><li>Top: encoder states <span class="k">h₁…h₅</span>, one per word.</li>
  <li>Bottom: decoder states <span class="q">s₀ → s₁ → … → s₅</span>. Each step: (1) score every h_j with s_{t-1} → (2) softmax → (3) context <span class="v">c_t = Σ α_j h_j</span> → (4) <span class="f">s_t = tanh(W_s s_{t-1} + W_y y_{t-1} + W_c c_t)</span> → emit a word.</li>
  <li>s carries "what kind of word is needed" (grammar, position); c carries "what the source has at that spot" (content).</li>
  <li><b>Bridge test</b>: keep s₄, swap the source noun, and α moves to bridge and the output flips to Brücke. s alone cannot tell them apart.</li></ul>`});

push({kicker:"Act 2", title:"That model's attention map", fig:"alignmentSvg",
  html:`<p>The α values from the animation collected into a table. Rows are output steps, columns source words, brighter means more weight.</p>
  <ul><li>Only row 2 (Tier) and row 5 (Straße) concentrate on one cell. Nouns need the source.</li>
  <li>Rows 1, 3, 4 spread out. das, überquerte, die come from grammar alone.</li>
  <li>Compared with the bridge table: the decoder states are nearly identical (max difference 0.04) and rows 1–4 emit the same <b>words</b>. Rows 3–4 do shift weight toward bridge, but those words do not depend on source content. <b>Only row 5 changes its word.</b></li></ul>
  <p class="dim">The attention visualisations in the paper's appendix (it → animal) are the 512-dim, 8-head version of this table.</p>`});

setup("Act 2", "What everyone still believed: attention is a patch for RNNs", [
  "GNMT (2016) was still 8 LSTM layers + attention. Curse 2 (sequential) untouched",
  "The convolution camp (ByteNet, ConvS2S): parallel, but distant words meet only after <b>log n layers</b>",
  "Self-attention: O(1) sequential steps, O(1) path length. The price: O(n²·d) per layer",
  "<b>The dangerous question</b>: if attention is what fixes the RNN, what if we delete the RNN and keep only attention?"],
 ["Three rows race: the RNN takes 8 hops, conv 2 layers, attention <b>1</b>", "This is Table 1 of the paper"]);
push({kicker:"Act 2", title:"From word 1 to word n: path length by architecture", video:"A04ThreeWays",
  html:`<table><tr><th></th><th>per layer</th><th>sequential ops</th><th>max path</th></tr>
  <tr><td>RNN</td><td>O(n·d²)</td><td>O(n)</td><td>O(n)</td></tr>
  <tr><td>Conv (k)</td><td>O(k·n·d²)</td><td>O(1)</td><td>O(log_k n)</td></tr>
  <tr><td><span class="acc">Self-attention</span></td><td>O(n²·d)</td><td><b>O(1)</b></td><td><b>O(1)</b></td></tr></table>
  <p>ByteNet (2016) and ConvS2S (2017) parallelise with convolutions, but distant words still need several layers to interact.</p>
  <div class="callout"><b>The dangerous question</b> (Jakob Uszkoreit): if attention is what fixes the RNN, what happens if we delete the RNN and keep only attention?</div>`});

push({type:"section", kicker:"Act 3 · 15–48 min", title:"The leap", sub:"Self-attention as a soft lookup, then multi-head, positions, and the whole block assembled."});

push({kicker:"Act 3 · self-attention", title:"First, an analogy: a library card catalogue", fig:"library",
  html:`<ul><li><span class="q">query</span>: the question card you bring. "Who is my subject?"</li>
  <li><span class="k">key</span>: the label on each drawer. "I am a noun", "I am an article".</li>
  <li><span class="v">value</span>: what is inside the drawer. Label and contents sit together but do different jobs.</li>
  <li>Match the card against the labels to split a budget (α), then take a little from each drawer by that budget.</li></ul>
  <p class="dim">All three come from the same token vector x through different matrices: q = xW^Q, k = xW^K, v = xW^V.</p>`});

setup("Act 3 · self-attention", "Self-attention: every token writes three things", [
  "<span class='q'>query</span> q = xW^Q: what am I looking for",
  "<span class='k'>key</span> k = xW^K: what do I look like to others",
  "<span class='v'>value</span> v = xW^V: what do I hand over if chosen",
  "A token's output = <b>the values, blended by how well its query matches each key</b>",
  "<span class='f'>Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V</span>"],
 ["The dot product as the <b>length of the shadow</b> of a key on the query", "Three scores → bars → softmax, summing to 1.00", "The example sets W^Q = W^K, so q_sat looks like k_sat. In a real model they differ"]);
push({kicker:"Act 3 · self-attention", title:"Attention = a soft lookup: score → normalise → blend", video:"A05SoftLookup",
  html:`<p>Every token writes three things about itself.</p>
  <ul><li><span class="q"><b>query</b></span> q: what am I looking for?</li><li><span class="k"><b>key</b></span> k: what do I contain, as seen by others?</li><li><span class="v"><b>value</b></span> v: what will I hand over if picked?</li></ul>
  <p class="f">Attention(Q,K,V) = softmax(QKᵀ/√d_k)·V</p>
  <p>Example (<span class="f">d_k=2</span>): q_sat·k = [1, 1, 2] → ÷√2 → [0.71, 0.71, 1.41] → softmax → <span class="red">[0.25, 0.25, 0.50]</span> → output = 0.25·v_The + 0.25·v_cat + 0.50·v_sat</p>`});

setup("Act 3 · self-attention", "Why divide by √d_k", [
  "The dot product of two unit-variance vectors has variance <b>d_k</b>. At d_k = 64 the scores are 8× wider",
  "Wide scores push softmax into a near one-hot spike → gradient ≈ 0 there → learning stalls",
  "Dividing by √d_k restores variance 1 at any width",
  "The paper: additive attention beat <i>unscaled</i> dot-product attention at large d_k; one division closes the gap"],
 ["The histogram <b>widening</b> as the d_k slider grows", "The softmax on the right collapsing to a spike", "Turning the division on: fixed width, softmax stays soft"]);
push({kicker:"Act 3 · self-attention", title:"Why divide by √d_k", video:"A06WhySqrt",
  html:`<ul><li>The dot product of two unit-variance vectors has variance <b>d_k</b>. At d_k = 64 the scores are 8× wider.</li>
  <li>Large scores turn softmax into a near one-hot spike whose gradient is ≈ 0. Learning stalls.</li>
  <li>Dividing by √d_k pins the spread to 1 for any d_k.</li></ul>
  <p class="dim">Paper: additive attention beat <i>unscaled</i> dot-product attention at large d_k. One division closes the gap while keeping matrix-multiply speed.</p>`});

setup("Act 3 · self-attention", "The same computation for all tokens at once: matrices", [
  "One row of Q · one column of Kᵀ = one cell of the score grid",
  "Softmax each row → a <b>heat map</b> whose rows sum to 1.00. This is the attention map in the paper's appendix",
  "Each heat-map row blends the rows of V into one output row",
  "After one layer, every token has looked around the whole sentence. At once, in parallel"],
 ["Row and column highlights filling the grid cell by cell", "The grid turning into a heat map with 1.00 beside each row", "Each output row = 'this word as a mix of the others'"]);
push({kicker:"Act 3 · self-attention", title:"The same lookup as matrices: QKᵀ → row softmax → ×V", video:"A07MatrixView",
  html:`<ul><li>One row of <span class="q">Q</span> · one column of <span class="k">Kᵀ</span> = one cell of the score grid.</li>
  <li>Softmax each row → a heat map whose rows sum to 1.00. This is the "attention map" in the paper's appendix.</li>
  <li>Each heat-map row blends the rows of <span class="v">V</span> into one output row.</li>
  <li>Overlay the grid on the sentence and the cells become word-to-word links: in the paper's figure, <b>it</b> lights up <b>animal</b>.</li></ul>`});

push({kicker:"Act 3 · multi-head", title:"Figure 2 of the paper: one unit, then eight", fig:"fig2",
  html:`<ul><li>Left: Scaled Dot-Product Attention. MatMul → ÷√d_k → (mask) → softmax → MatMul. The three steps you just saw.</li>
  <li>Right: Multi-Head. Project Q, K, V h = 8 times (512 → 64), run the left-hand unit eight times in parallel, concatenate (512), mix with W^O.</li>
  <li>The mask is only switched on in decoder self-attention.</li></ul>`});

setup("Act 3 · multi-head", "A word has more than one relationship: multi-head", [
  "One attention pattern = one relationship. A word wants to ask several questions at once",
  "Split 512 dims into <b>eight 64-dim slices</b>, each with its own W^Q, W^K, W^V, and attend separately",
  "Concatenate the eight outputs (512) and mix with W^O",
  "<b>The cost equals one 512-dim head.</b> The width is divided, not multiplied"],
 ["The tall vector splitting into eight colour bands", "Three heads with <b>different patterns</b>: neighbours / everything to the verb / it → animal", "The bands rejoining and passing through W^O"]);
push({kicker:"Act 3 · multi-head", title:"Multi-head: split the width, run 8 lookups in parallel", video:"A08MultiHead",
  html:`<p>One attention pattern is one relationship. A word also wants to know "who modifies me?", "what do I refer to?", "what is next to me?". One softmax would blur them all.</p>
  <ul><li>h = 8 small W_i^Q, W_i^K, W_i^V project 512 → 64 each; each slice attends on its own.</li>
  <li>Concatenate the eight 64-dim outputs back to 512 and mix with W^O.</li>
  <li><b>Same cost as one 512-dim head.</b> The width is divided, not multiplied.</li></ul>
  <p class="f">MultiHead = Concat(head_1…head_8)·W^O</p>`});

push({kicker:"Act 3 · block", title:"Figure 1 of the paper: the three places attention is used", fig:"fig1",
  html:`<ul><li><span class="q">① encoder self-attention</span>: Q, K, V all from the source tokens. The source looks at itself.</li>
  <li><span class="k">② decoder masked self-attention</span>: the target looks only at earlier target tokens.</li>
  <li><span class="v">③ encoder-decoder (cross) attention</span>: Q from the decoder layer, K·V from the encoder output. The glance from Act 2.</li>
  <li>Residual + LayerNorm after every sublayer; a position-wise FFN at the end of every layer.</li></ul>`});

setup("Act 3 · position", "The trap nobody warns you about", [
  "Nothing in the attention formula says <b>where</b> a token is",
  "Shuffle the input rows and the output rows shuffle identically. 'dog bites man' = 'man bites dog'",
  "An RNN reads in order, so order came for free. Dropping the RNN dropped order with it",
  "Fix: add a <span class='pos'>position vector</span> to each embedding before the first layer"],
 ["Reversing the words leaves the output boxes <b>merely rearranged</b>", "After adding the purple position bands, reversing changes the outputs"]);
push({kicker:"Act 3 · position", title:"Attention alone is a bag of words", video:"A09ShuffleTest",
  html:`<ul><li>The attention formula has no notion of <b>where</b> a token is.</li>
  <li>Shuffle the input rows and the output rows shuffle identically. "dog bites man" = "man bites dog".</li>
  <li>Fix: add a <span class="pos">position vector</span> to each embedding before the first layer.</li></ul>`});

setup("Act 3 · position", "Why sinusoids for position", [
  "<span class='f'>PE(pos,2i)=sin(pos/10000^{2i/d}), PE(pos,2i+1)=cos(…)</span>",
  "One (sin, cos) pair = <b>one clock hand</b>. Early dimensions spin fast (fine position), late ones crawl (coarse)",
  "pos → pos+k is a <b>fixed rotation</b> of every hand. A linear layer can learn relative offsets",
  "Learned position embeddings scored about the same (Table 3, row E)"],
 ["Fast stripes on the left of the heat map, slow stripes on the right", "Advancing the hand by +3 is the <b>same angle</b> wherever it starts"]);
push({kicker:"Act 3 · position", title:"Sinusoidal positions: many clocks at different speeds", video:"A10Sinusoids",
  html:`<p class="f">PE(pos,2i) = sin(pos/10000^{2i/d}),  PE(pos,2i+1) = cos(…)</p>
  <ul><li>Each pair of dimensions is a clock hand turning at its own speed. Early dimensions spin fast (fine position), late ones crawl (coarse). A smooth version of counting in binary.</li>
  <li>pos → pos+k is a <b>fixed-angle rotation</b> of each (sin, cos) pair, so a linear layer can learn "look 3 tokens back".</li>
  <li>Learned positional embeddings gave nearly identical BLEU (Table 3, row E).</li></ul>`});

setup("Act 3 · decoder", "The decoder must not see the future", [
  "During training the whole target sentence is fed to the decoder at once",
  "Peeking at word 4 while predicting word 3 is cheating → set future scores to <b>−∞ before</b> the softmax",
  "After softmax those weights are exactly 0. Row 1 sees only itself, the last row sees everything so far",
  "So the whole target trains in <b>one parallel pass</b> → curse 2 lifted on the decoder side too"],
 ["The triangle covering the upper-right of the grid with −∞", "Those cells becoming <b>0</b> after softmax", "Row 1 versus row 6"]);
push({kicker:"Act 3 · decoder", title:"Decoder self-attention: mask the future", video:"A11Mask",
  html:`<ul><li>Future positions get a score of <span class="red">−∞</span> before the softmax, so their weight is exactly 0 afterwards.</li>
  <li>Row 1 attends only to itself; the last row to everything so far.</li>
  <li>This lets the whole target train in <b>one parallel pass</b> while behaving as if generated left to right.</li></ul>`});

setup("Act 3 · block", "Three more parts complete a layer", [
  "<b>FFN</b>: <span class='f'>max(0, xW₁+b₁)W₂+b₂</span>, 512→2048→512, per token. Attention <i>gathers</i>, the FFN <i>thinks</i>",
  "<b>Residual</b>: <span class='f'>x + Sublayer(x)</span>. A highway straight through six layers; stops gradients vanishing with depth",
  "<b>LayerNorm</b>: re-centre and rescale each token vector",
  "Encoder layer = self-attn → add&norm → FFN → add&norm. The decoder adds cross-attention"],
 ["The input splitting: one copy through the block, one along the green rail, then added back", "Scattered points snapping onto a circle: <b>LayerNorm</b>"]);
push({kicker:"Act 3 · block", title:"The residual highway, LayerNorm, and the FFN", video:"A12Residual",
  html:`<p>Encoder layer (×6): <span class="f">x → MultiHeadSelfAttn → add&amp;norm → FFN → add&amp;norm</span></p>
  <ul><li><b>FFN</b>: <span class="f">max(0, xW₁+b₁)W₂+b₂</span>, 512 → 2048 → 512, applied to each token independently. Attention <i>gathers</i>; the FFN is where each token <i>thinks</i> about what it gathered.</li>
  <li><b>Residual</b>: <span class="f">x + Sublayer(x)</span>. A highway straight through six layers.</li>
  <li><b>LayerNorm</b>: re-centre and rescale each token vector. (The paper is post-norm; modern models use pre-norm.)</li></ul>`});

setup("Act 3 · block", "Assemble the whole machine", [
  "Source tokens + positions → 6 encoder layers",
  "Target tokens (shifted right) + positions → 6 decoder layers; each layer's <span class='v'>cross-attention</span> pulls K·V from the encoder output",
  "Linear + softmax at the top emits one word, which is appended to the decoder input and the loop repeats",
  "The Act 1 counter now reads <b>1</b>. Encoder and decoder both train in parallel. Both curses lifted"],
 ["Figure 1 of the paper built piece by piece", "The <b>green arrow</b> from the encoder top into the decoder's middle block (cross-attention)", "The output word looping back into the input"]);
push({kicker:"Act 3 · block", title:"The whole machine: encoder, decoder, cross-attention", video:"A13FullFlow",
  html:`<ul><li>Source tokens rise through six encoder layers.</li>
  <li>Target tokens rise through six decoder layers; each layer's <span class="v">cross-attention</span> pulls K·V from the encoder's final output. Bahdanau's glance, rebuilt from the same primitive.</li>
  <li>Linear + softmax emits one token, which is fed back to the bottom of the decoder, and the loop repeats.</li></ul>`});

push({kicker:"Act 3b · proof", title:"Training recipe and results",
  html:`<div class="two"><div><h2>Recipe</h2><ul>
  <li>WMT14 En→De, 4.5M pairs, BPE 37k. En→Fr, 36M pairs, word-piece 32k.</li>
  <li>One machine, 8× P100. base: 100k steps ≈ <b>12 hours</b>; big: 300k steps ≈ 3.5 days.</li>
  <li>Adam (β₂ = 0.98) with the 4000-step warm-up schedule.</li>
  <li>dropout 0.1, label smoothing 0.1, beam 4, length penalty 0.6, checkpoint averaging.</li></ul></div>
  <div><h2>Results (Table 2)</h2><table><tr><th>model</th><th>En→De</th><th>En→Fr</th></tr>
  <tr><td>previous best (incl. ensembles)</td><td>26.4</td><td>41.3</td></tr>
  <tr><td>Transformer base</td><td>27.3</td><td>38.1</td></tr>
  <tr><td><span class="acc">Transformer big</span></td><td><b>28.4</b></td><td><b>41.8</b></td></tr></table>
  <p class="dim">big trains at under 1/4 of the FLOPs of the previous best.</p></div></div>`});

push({kicker:"Act 3b · proof", title:"BLEU: a single model beat the ensembles", fig:"results",
  html:`<ul><li>En→De: big 28.4, +2.0 over the previous best (ConvS2S ensemble, 26.36). base 27.3 already beats every single model.</li>
  <li>En→Fr: big 41.8. base 38.1 trails, but at an order of magnitude less training compute.</li>
  <li>The bars look close, but one BLEU point was about a year of progress at the time.</li></ul>`});

setup("Act 3b · proof", "The price tag: n²", [
  "One self-attention layer = an n×n grid of depth d → <b>n²·d</b>. Recurrence = n×d of depth d → n·d²",
  "While n &lt; d (= 512), attention is cheaper. Sentences in 2017 were tens of tokens",
  "Past n = d the grid gets expensive. That is the cost of O(1) path length",
  "The one real limit the paper names itself; the starting point of a decade of 'efficient attention'"],
 ["The two lines crossing at <b>n = 512</b>", "Right-hand tiles: the red n×n square outgrows the blue n×d rectangle"]);
push({kicker:"Act 3b · proof", title:"Cost per layer: n²·d versus n·d²", video:"A14Complexity",
  html:`<ul><li>Self-attention is an <span class="red">n×n</span> grid of depth d; recurrence is an <span class="q">n×d</span> rectangle of depth d.</li>
  <li>While n &lt; d (= 512), attention is cheaper. Past that, the n² grid is the price of O(1) path length.</li>
  <li>The one genuine limit the paper names. A decade of "efficient attention" research is the footnote to this sentence.</li></ul>`});

setup("Act 3b · proof", "One piece of the recipe: the learning-rate schedule", [
  "<span class='f'>lr = d_model^{-0.5} · min(step^{-0.5}, step·warmup^{-1.5})</span>",
  "Linear warm-up to step 4000, then decay as 1/√step",
  "A post-norm Transformer is unstable without warm-up. This curve became the default for almost every Transformer since",
  "Adam β₂ = 0.98, dropout 0.1, label smoothing 0.1, beam 4"],
 ["The peak of the curve at step 4000", "Two regimes: <span class='v'>linear rise</span> and <span class='red'>inverse-square-root decay</span>"]);
push({kicker:"Act 3b · proof", title:"Learning rate: 4000 warm-up steps, then 1/√step", video:"A15Warmup",
  html:`<p class="f">lr = d_model^{-0.5} · min(step^{-0.5}, step·warmup^{-1.5})</p>
  <ul><li>Rise linearly, then decay as the inverse square root.</li>
  <li>A post-norm Transformer is unstable without warm-up. This schedule became the default for almost every Transformer since.</li></ul>`});

push({kicker:"Act 3b · proof", title:"Ablations (Table 3): what the authors learned",
  html:`<ul><li><b>Heads</b>: 1 head is 0.9 BLEU worse; 32 heads is also worse. Too many tiny heads lose capacity.</li>
  <li><b>Shrinking d_k</b> hurts: matching queries to keys is not a trivial job.</li>
  <li><b>Bigger is better.</b> The line that launched the scaling era.</li>
  <li><b>Dropout</b> matters a lot. Learned positions ≈ sinusoids.</li></ul>
  <div class="callout">Generalisation: applied to Penn Treebank constituency parsing (40k sentences) with no task-specific tuning, it beat most previous parsers (91.3 F1 WSJ-only, 92.7 semi-supervised).</div>`});

push({kicker:"Act 3b · proof", title:"Heads: one is too few, thirty-two too many", fig:"heads",
  html:`<ul><li>h = 1: 24.9. One relationship at a time costs 0.9 BLEU.</li>
  <li>h = 8, 16: 25.8. The paper chose 8.</li>
  <li>h = 32: 25.4. Each head is 16-dimensional, too little capacity to match queries to keys.</li></ul>`});

push({kicker:"Act 3b · proof", title:"Base and big", fig:"hparams",
  html:`<ul><li>big doubles the width (d_model 1024, d_ff 4096, h 16) and keeps d_k = 64.</li>
  <li>dropout raised to 0.3, trained three times longer.</li>
  <li>3.3× the parameters, +1.1 BLEU (En→De). The first data point of "bigger is better".</li></ul>`});

push({type:"section", kicker:"Act 4 · 48–55 min", title:"The aftermath", sub:"The architecture outlived its task. Translation turned out to be the least of it."});

setup("Act 4", "The block outlived the task", [
  "2018 <b>BERT</b>: keep the encoder, pretrain with masked tokens",
  "2018 <b>GPT</b>: keep the masked decoder, predict the next token. GPT-2, GPT-3: 'bigger is better' has a long runway",
  "2020 <b>ViT</b>: 16×16 image patches are the tokens. Proteins, audio, code follow",
  "Today: almost every frontier model is a decoder-only Transformer"],
 ["Encoder-decoder → decoder fades: BERT. Encoder fades: GPT", "Word tokens turn into image patches", "The blocks stack up and leave the frame"]);
push({kicker:"Act 4", title:"The block outlived the task", video:"A16Morph",
  html:`<ul><li><b>2018 BERT</b>: encoder only, masked-token pretraining, fine-tune for everything.</li>
  <li><b>2018 GPT</b>: masked decoder only, next-token prediction. GPT-2 (2019), GPT-3 (2020): "bigger is better" has a very long runway.</li>
  <li><b>2020 ViT</b>: 16×16 image patches as tokens. AlphaFold2, audio, code, robotics.</li>
  <li><b>Today</b>: essentially every frontier model is a decoder-only Transformer.</li></ul>`});

push({kicker:"Act 4", title:"What was kept and what was replaced",
  html:`<table><tr><th>Kept</th><th>Replaced</th></tr>
  <tr><td>Scaled dot-product attention, Q/K/V</td><td>Sinusoidal PE → RoPE / ALiBi</td></tr>
  <tr><td>Multi-head, residuals, FFN</td><td>Post-norm → pre-norm, LayerNorm → RMSNorm</td></tr>
  <tr><td>Warm-up schedule, Adam</td><td>ReLU FFN → SwiGLU</td></tr>
  <tr><td>Masked decoding</td><td>Encoder-decoder → decoder-only</td></tr>
  <tr><td></td><td>Full K·V per head → multi-query / grouped-query attention</td></tr>
  <tr><td></td><td>Naive O(n²) memory → FlashAttention (exact, IO-aware)</td></tr></table>`});

const NOTES = ["한 문단 요약: 기계는 오랫동안 문장을 열쇠구멍으로 두루마리를 읽듯 한 단어씩 읽었고, 지금까지 본 것을 점점 붐비는 기억 하나에 담아야 했다. 2014년의 attention은 그 독자가 두루마리를 다시 흘끗 볼 수 있게 해 준 목발이었다. 2017년 Google 팀은 무모한 질문을 던졌다. 흘끗 보는 것 자체가 읽기라면? 열쇠구멍을 버리고 모든 단어가 서로를 동시에 보게 하자. 결과는 8개 GPU로 12시간 학습해 모든 번역 시스템을 이겼고, 이후 거의 모든 대형 모델의 청사진이 됐다.", "이 문장을 직역하면 뭐가 될까요? \"Take the L\". 구조만 보면 아주 단순하죠. 2014년에 RNN 인코더-디코더로 신경망 번역이 본격적으로 시작됐을 때 이런 짧은 문장은 쉽게 처리됐습니다. (Take the L은 관용구라 직역은 틀리지만, \"구조가 단순하다\"는 점만 쓰고 의미는 다음 문장이 설명해 준다고 넘어가세요.)\n인코더는 초기 상태 H_0에서 출발해 단어를 하나씩 읽습니다. 단어를 읽을 때마다 같은 크기의 상태 벡터를 새로 덮어씁니다. 마지막 단어까지 읽으면 상태가 하나 남는데, 디코더가 받는 건 이 마지막 벡터 하나뿐입니다. 중간 상태는 전부 버려집니다.\n문제는 두 가지입니다. 첫째, 문장이 길어져도 벡터 크기는 그대로인데 매 단어마다 덮어쓰기를 하니까 초반 단어들의 흔적은 희석됩니다. 둘째, 한 단어씩 순서대로 계산해야 하니 병렬화가 안 됩니다. 이 두 가지를 기억해 두세요. 오늘 논문은 이 둘에 대한 답입니다.\n긴 문장에서 it은 무엇을 가리킬까요? 이 길이(약 15토큰)에서도 지시 대상이 흔들리기 시작하고, 30–40단어를 넘으면 LSTM도 확실히 무너집니다. Ray Mooney(2014): \"You can't cram the meaning of a whole %&!$# sentence into a single $&!#* vector.\"", "인코더 RNN은 셀 하나입니다. 들어오는 건 두 개, 지금 읽는 단어의 벡터와 바로 직전의 기억 벡터입니다. 셀은 두 개를 각자 행렬로 변환해서 더하고, tanh로 눌러서 새 기억 벡터를 내놓습니다. 이 셀을 단어 수만큼 반복해서 쓰는데, 가중치는 처음부터 끝까지 한 세트입니다.\n여기서 두 가지가 결정됩니다. 첫째, 이전 기억과 새 단어가 같은 슬롯에 더해지기 때문에 분리가 안 됩니다. 둘째, 첫 단어의 흔적은 W_h를 마흔 번 통과한 뒤에나 마지막 벡터에 남습니다. 숫자로 따라가 보면 한 단계마다 깎여 나가는 걸 눈으로 볼 수 있습니다.\n장난감 계산: W_x = I, W_h = 0.5·I, b = 0. h_1 = tanh([1,0]) ≈ [0.76, 0]; h_2 = tanh([0,1] + 0.5·h_1) ≈ [0.36, 0.76]; h_3 = tanh([1,1] + 0.5·h_2) ≈ [0.83, 0.88].\nLSTM: c_t = f_t ⊙ c_{t-1} + i_t ⊙ candidate. forget gate가 1에 가까우면 선택적 유지가 되고 기울기도 비교적 온전히 흐르지만, c_t도 고정 크기 벡터 하나이고 디코더가 받는 것도 마지막 상태 하나이며 계산은 여전히 직렬입니다.", "직렬 계산의 비용은 두 가지로 나누어 말하세요. (1) 경로 길이: 멀리 있는 단어 사이의 상호작용이 n에 비례하는 단계를 거쳐야 한다. (2) 병렬성: 시간축을 따라 병렬화할 수 없다. Transformer는 둘 다 해결하므로 여기서 분리해 두면 3막에서 회수할 때 효과가 큽니다.", "시간순으로 한 번 정리해 주는 정지 화면. 주황 점 두 개가 2막, 노란 점이 3막, 파랑·초록이 4막이라고 짚어 주면 청중이 지도를 갖게 됩니다.", "애니메이션 사이에 숨 고르는 정지 화면. \"무엇이 달라졌나\"를 한 문장으로 못 박는 용도.", "Bahdanau, Cho, Bengio (ICLR 2015). 점수 함수는 작은 feed-forward net(\"additive attention\"). Luong et al. 2015는 디코더-인코더 상태의 내적(\"multiplicative\")이 더 싸고 충분함을 보였다. 여전히 recurrence가 모델이고 attention은 뒤를 흘끗 보는 장치였다. 직렬 계산이라는 저주는 손대지 않았다.", "\"s가 이미 Straße를 낼 줄 아는데 왜 context가 필요한가?\"라는 질문에 대한 답이 이 장면입니다. s_0는 학습된 상수이고(h_T로 초기화하지 않음), 인코더 상태는 단어별 벡터(재귀 없음)라서 소스의 모든 정보는 attention을 통해서만 디코더에 들어옵니다. 그래서 명사를 내는 2단계와 5단계에서 α가 해당 위치에 몰리고, das/überquerte/die처럼 소스를 볼 필요가 없는 단계에서는 α가 퍼집니다. 이것 자체가 교훈입니다: attention은 \"내용이 필요할 때만\" 날카로워집니다.\n모델: lecture/manim/tiny_nmt.py. d=4, 약 230개 파라미터, 수치 미분 + Adam으로 학습, 9/9 정확. 숫자는 lecture/manim/tiny_nmt.json에 저장되어 애니메이션이 그대로 읽습니다.", "정적 heat map. 청중이 애니메이션 속도를 놓쳤을 때 돌아올 수 있는 닻 역할. 주의: 두 표의 3·4행 가중치가 다른 이유를 물으면, 매 단계 점수는 다섯 h 전부에 대해 다시 계산되므로 h_5가 바뀌면 가중치도 바뀐다고 답하세요. 상태 s가 같아도 key가 다르니까요. 단어는 문법만으로 결정되는 자리라 그대로입니다. 여기서 \"attention map을 읽는 법\"을 한 번 가르쳐 두면 3막의 행렬 장면과 논문 부록 그림이 바로 읽힙니다.", "논문 Table 1을 시각화한 장면. Self-attention은 이미 존재했다(Cheng 2016 intra-attention, Parikh 2016, Lin 2017). 항상 다른 것과 함께였을 뿐. 동료 대부분은 실패를 예상했다. 제목은 Llion Jones가 제안한 Beatles 농담. 8명의 저자는 무작위 순서, 모두 동등 기여라는 각주.", "숫자 애니메이션 전에 개념을 먼저 심는 정지 화면. \"왜 key와 value를 따로 두는가\"는 여기서 한 번, 그리고 multi-head 뒤에 한 번 더 물어보세요: 찾을 때 쓰는 특징과 꺼내 갈 내용은 다를 수 있기 때문입니다.", "공식을 오른쪽에서 왼쪽으로 세 단계 이야기로 읽으세요. (1) 점수: 모든 query와 모든 key의 내적 — \"우리는 얼마나 정렬돼 있나?\" (2) 정규화: 행마다 softmax — 점수가 합이 1인 양의 가중치가 된다. (3) 혼합: 가중치 × V — 각 토큰의 새 벡터는 자기가 고른 value들의 혼합. 사전 검색과 같지만 \"부드럽다\": 정확히 하나가 아니라 모든 항목을 조금씩 받는다. 내적은 투영의 길이(그림자)라는 점을 화살표로 보여 주세요. q = k = x·W 로 모두 같은 입력의 선형 변환이라는 점도 언급.", "softmax의 야코비안은 p_i(δ_ij − p_j). 하나의 p가 1에 가까우면 모든 항이 0에 가깝다. 히스토그램이 넓어질수록 한 행에서 최대값과 나머지의 차이가 커져 spike가 생긴다는 흐름으로 설명.", "3토큰 예시를 A5, A7, A9, A11에서 반복해 청중이 데이터를 다시 배우지 않게 합니다. 행 합 1.00을 항상 띄워 \"가중치는 예산\"이라는 감각을 심으세요.", "논문의 그림을 그대로 재현한 정지 화면. 원본 PDF 4쪽 Figure 2를 옆에 띄워도 좋습니다.", "부록 그림: coreference를 따라가는 head(its → Law), 지역 구문을 보는 head, 거의 대각선인 head. Table 3: head 1개는 0.9 BLEU 나쁘고, 32개도 나쁘다 — 너무 작은 head는 용량을 잃는다.", "애니메이션(FullFlow)이 조립하는 동안 말로 설명하기 어렵다면, 이 정지 화면에서 세 자리를 먼저 짚고 애니메이션은 요약으로 트는 순서를 추천합니다.", "아무도 미리 말해 주지 않다가 뒤늦게 깨닫는 함정으로 연출하면 좋습니다. permutation equivariance라는 용어를 쓰되, 그림으로는 \"같은 색 상자들이 자리만 바뀜\"으로 충분합니다.", "선택 이유 두 가지: 상대 위치가 선형 함수(회전)로 표현됨, 학습보다 긴 길이로 외삽 가능하리라는 기대. 이후 RoPE가 이 \"회전\" 아이디어를 q·k 내적 안으로 옮겼다는 점은 4막에서.", "\"teacher forcing + mask = 병렬 학습\"이 핵심. 추론 시에는 토큰 하나씩 생성하며 매번 디코더를 다시 돌린다(KV cache는 후대의 최적화).", "Decoder layer는 세 sublayer: masked self-attn → cross-attn(Q는 디코더, K·V는 인코더 출력) → FFN. 입력·출력 임베딩과 softmax 가중치 공유, 임베딩에 √d_model 곱함. base: d_model 512, h 8, d_ff 2048, N 6, dropout 0.1, 65M. big: 1024/16/4096, dropout 0.3, 213M.", "논문 Figure 1을 조각조각 쌓는 장면. 여기서 1막의 카운터 장면을 다시 틀고 \"1에서 멈춘다\"고 말하면 이야기가 닫힙니다.", "En→Fr big 점수는 arXiv 최종판 기준 41.8(초기판 41.0). 청중의 복사본에 따라 다를 수 있음. 학습 비용 비교는 Table 2 하단의 FLOPs 열.", "Table 2를 막대로. 주황이 Transformer. En→Fr base가 낮은 이유를 물으면: 36M 쌍 데이터에 100k step은 짧다, big은 300k step.", "Table 1의 첫 열. 당시 문장 길이는 수십 토큰이라 n ≪ d였고, 논문은 restricted attention(이웃 r개만)도 제안했지만 쓰지 않았다.", "Adam β₁=0.9, β₂=0.98, ε=1e-9. 이 곡선의 최고점은 step 4000, 값은 약 7e-4.", "Table 3 행 (A) heads, (B) d_k, (C) 크기, (D) dropout/label smoothing, (E) positional. 구문 분석 결과는 Table 4.", "Table 3 row A. d_model이 512로 고정이라 h를 늘리면 d_k가 줄어든다는 점을 꼭 말하세요. 그래서 \"head가 많을수록 좋다\"가 아닙니다.", "Table 3 마지막 행과 5.1~5.4절 요약.", "8명의 저자는 모두 Google을 떠나 이 논문 위에 세운 회사를 만들거나 합류했다. 제목은 농담이었지만 예언이 됐다.", "마무리 슬라이드. 왼쪽 열이 2017년 그대로라는 점을 강조. 오른쪽 열은 모두 \"같은 블록을 더 크게, 더 길게, 더 싸게\"를 위한 수정.", "발표에는 넣지 않는 작업용 슬라이드."];
let ni = 0; S.forEach(s => { if (s.type !== "setup" && s.type !== "section" && NOTES[ni] !== undefined) { s.notes = NOTES[ni++]; } });

// ---------------------------------------------------------------- engine
const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.type || "content");
  const nextClip = (S[i + 1] && S[i + 1].video) ? S[i + 1].video : null;
  if (s.type === "cover") {
    el.innerHTML = `<div class="kicker">${s.kicker||""}</div><h1>${s.title}</h1>${s.html||""}`;
  } else if (s.type === "setup") {
    el.innerHTML = `<div class="kicker">${s.kicker||""}${nextClip ? `<span class="clip">next: media/${nextClip}.mp4</span>` : ""}</div><h2>${s.title}</h2>
      <div class="body"><div class="script"><ul>${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul></div>
      <div class="watch"><h3>Watch for in the next animation${nextClip ? ` · ${nextClip}` : ""}</h3><ol>${s.watch.map(w=>`<li>${w}</li>`).join("")}</ol></div></div>`;
  } else if (s.type === "section") {
    el.innerHTML = `<div class="kicker">${s.kicker||""}</div><h1>${s.title}</h1><div class="sub">${s.sub||""}</div>`;
  } else {
    const media = s.video
      ? `<div class="media"><video muted playsinline preload="metadata" src="media/${s.video}.mp4" title="${s.video} — click to replay"></video></div>`
      : s.fig ? `<div class="media fig">${FIG[s.fig]}</div>` : "";
    const tag = s.video ? `<span class="clip">animation here: media/${s.video}.mp4</span>` : s.fig ? `<span class="clip" style="border-color:var(--dim);color:var(--dim)">figure: figures/${s.fig.replace("Svg","")}.png</span>` : "";
    el.innerHTML = `<div class="kicker">${s.kicker||""}${tag}</div><h2>${s.title}</h2>
      <div class="body ${(s.video || s.fig) ? "" : "noscript"}">${media}<div class="script">${s.html||""}</div></div>`;
  }
  deck.appendChild(el);
});
const slides = [...document.querySelectorAll(".slide")];
let cur = -1, loop = false;
const notes = document.getElementById("notes"), notesBody = document.getElementById("notesBody");
const counter = document.getElementById("counter"), bar = document.getElementById("bar");
function show(i, replay = true) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  if (cur >= 0) { slides[cur].classList.remove("active"); const v = slides[cur].querySelector("video"); if (v) v.pause(); }
  cur = i;
  slides[cur].classList.add("active");
  const v = slides[cur].querySelector("video");
  if (v && replay) { v.loop = loop; v.currentTime = 0; v.play().catch(() => {}); }
  notesBody.innerHTML = (S[cur].notes || "").split(/\n+/).map(p => `<p>${p}</p>`).join("");
  counter.textContent = `${cur + 1} / ${slides.length}`;
  bar.style.width = `${(cur + 1) / slides.length * 100}%`;
  history.replaceState(null, "", `#${cur + 1}`);
}
function replay() { const v = slides[cur].querySelector("video"); if (v) { v.currentTime = 0; v.play().catch(() => {}); } }
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); show(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(slides.length - 1);
  else if (e.key.toLowerCase() === "r") replay();
  else if (e.key.toLowerCase() === "n") notes.classList.toggle("show");
  else if (e.key.toLowerCase() === "l") toggleLoop();
  else if (e.key.toLowerCase() === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
deck.addEventListener("click", e => { if (e.target.tagName === "VIDEO") replay(); });
document.querySelectorAll("video").forEach(v => v.addEventListener("error", () => {
  const ph = document.createElement("div"); ph.className = "ph";
  ph.textContent = `Missing video: ${v.getAttribute("src")} — run lecture/manim/render.sh to generate it`;
  v.replaceWith(ph);
}));
function toggleLoop() { loop = !loop; document.getElementById("loopBtn").classList.toggle("on", loop); const v = slides[cur].querySelector("video"); if (v) v.loop = loop; }
document.getElementById("loopBtn").onclick = toggleLoop;
document.getElementById("notesBtn").onclick = () => notes.classList.toggle("show");
let tx = null;
document.addEventListener("touchstart", e => tx = e.touches[0].clientX, {passive:true});
document.addEventListener("touchend", e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); tx = null; });
show(parseInt(location.hash.slice(1) || "1", 10) - 1);
window.addEventListener("hashchange", () => show(parseInt(location.hash.slice(1) || "1", 10) - 1));
</script>
