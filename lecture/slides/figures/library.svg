<svg style="background:#0e1116" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, Segoe UI, system-ui, sans-serif" style="width:100%;height:100%;display:block"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b94a7"/></marker></defs><text x="640" y="56" fill="#e6eaf2" font-size="28" text-anchor="middle" font-weight="650" >Query · Key · Value — 도서관 카드 목록으로 읽기</text><rect x="70" y="140" width="300" height="170" rx="8" fill="rgba(88,196,221,0.08)" stroke="#58c4dd" stroke-width="2" /><text x="220" y="180" fill="#58c4dd" font-size="24" text-anchor="middle" font-weight="650" >query q</text><text x="220" y="220" fill="#e6eaf2" font-size="20" text-anchor="middle" font-weight="400" >"내 주어가 누구지?"</text><text x="220" y="252" fill="#8b94a7" font-size="16" text-anchor="middle" font-weight="400" >지금 이 토큰이 찾는 것</text><text x="220" y="280" fill="#8b94a7" font-size="16" text-anchor="middle" font-weight="400" >q = x · W^Q</text><rect x="520" y="130" width="330" height="90" rx="8" fill="rgba(255,134,47,0.08)" stroke="#ff862f" stroke-width="2" /><text x="540" y="162" fill="#ff862f" font-size="18" text-anchor="start" font-weight="650" >key k_The</text><text x="540" y="192" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >"관사"</text><rect x="880" y="130" width="300" height="90" rx="8" fill="rgba(131,193,103,0.08)" stroke="#83c167" stroke-width="2" /><text x="900" y="162" fill="#83c167" font-size="18" text-anchor="start" font-weight="650" >value v_The</text><text x="900" y="192" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >'the'의 내용</text><line x1="370" y1="225" x2="520" y2="175" stroke="rgb(75,51,61)" stroke-width="1.5"  /><text x="445" y="192" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >α=0.05</text><line x1="850" y1="175" x2="880" y2="175" stroke="#8b94a7" stroke-width="1"  /><rect x="520" y="250" width="330" height="90" rx="8" fill="rgba(255,134,47,0.08)" stroke="#ff862f" stroke-width="2" /><text x="540" y="282" fill="#ff862f" font-size="18" text-anchor="start" font-weight="650" >key k_cat</text><text x="540" y="312" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >"명사 · 주어 후보"</text><rect x="880" y="250" width="300" height="90" rx="8" fill="rgba(131,193,103,0.08)" stroke="#83c167" stroke-width="2" /><text x="900" y="282" fill="#83c167" font-size="18" text-anchor="start" font-weight="650" >value v_cat</text><text x="900" y="312" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >'cat'의 내용</text><line x1="370" y1="225" x2="520" y2="295" stroke="rgb(213,69,72)" stroke-width="8"  /><text x="445" y="252" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >α=0.70</text><line x1="850" y1="295" x2="880" y2="295" stroke="#8b94a7" stroke-width="1"  /><rect x="520" y="370" width="330" height="90" rx="8" fill="rgba(255,134,47,0.08)" stroke="#ff862f" stroke-width="2" /><text x="540" y="402" fill="#ff862f" font-size="18" text-anchor="start" font-weight="650" >key k_sat</text><text x="540" y="432" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >"동사"</text><rect x="880" y="370" width="300" height="90" rx="8" fill="rgba(131,193,103,0.08)" stroke="#83c167" stroke-width="2" /><text x="900" y="402" fill="#83c167" font-size="18" text-anchor="start" font-weight="650" >value v_sat</text><text x="900" y="432" fill="#e6eaf2" font-size="18" text-anchor="start" font-weight="400" >'sat'의 내용</text><line x1="370" y1="225" x2="520" y2="415" stroke="rgb(117,57,64)" stroke-width="3.5"  /><text x="445" y="312" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >α=0.25</text><line x1="850" y1="415" x2="880" y2="415" stroke="#8b94a7" stroke-width="1"  /><text x="640" y="540" fill="#e6eaf2" font-size="18" text-anchor="middle" font-weight="400" >1. query와 모든 key의 궁합(내적)을 잰다   2. softmax로 합이 1인 예산을 나눈다   3. 그 예산대로 value를 섞어 가져온다</text><text x="640" y="580" fill="#ffd166" font-size="18" text-anchor="middle" font-weight="400" >사전 검색과 같지만, 한 서랍만 여는 게 아니라 모든 서랍을 조금씩 연다 → soft lookup</text><text x="640" y="640" fill="#8b94a7" font-size="16" text-anchor="middle" font-weight="400" >key와 value는 같은 서랍에 붙어 있지만 역할이 다르다: key는 '찾을 때 쓰는 라벨', value는 '꺼내 가는 내용'</text></svg>