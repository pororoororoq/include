-size="18" text-anchor="middle" font-weight="400" >h5</text><line x1="1167" y1="290" x2="960" y2="440" stroke="rgb(223,71,72)" stroke-width="7" stroke-dasharray="6 5" /><text x="1167" y="315" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >0.75</text><rect x="870" y="440" width="180" height="50" rx="8" fill="none" stroke="#58c4dd" stroke-width="1.5" /><text x="960" y="472" fill="#58c4dd" font-size="20" text-anchor="middle" font-weight="400" >decoder</text><text x="960" y="560" fill="#e6eaf2" font-size="20" text-anchor="middle" font-weight="400" >keep every state as a table, read a weighted sum each step</text><text x="960" y="592" fill="#83c167" font-size="18" text-anchor="middle" font-weight="400" >capacity grows with sentence length</text><text x="960" y="624" fill="#83c167" font-size="18" text-anchor="middle" font-weight="400" >any word reaches the decoder in one hop</text><line x1="640" y1="100" x2="640" y2="650" stroke="#2a3344" stroke-width="1"  /></svg>