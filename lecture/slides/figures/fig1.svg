<svg style="background:#0e1116" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Google Sans, Google Sans Text, Google Sans Flex, Product Sans, Roboto, Helvetica Neue, Arial, sans-serif" style="width:100%;height:100%;display:block"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b94a7"/></marker></defs><rect x="230" y="160" width="300" height="260" rx="8" fill="rgba(88,196,221,0.04)" stroke="#58c4dd" stroke-width="1.5" /><text x="240" y="150" fill="#58c4dd" font-size="18" text-anchor="start" font-weight="650" >Encoder  × 6</text><rect x="270" y="360" width="220" height="40" rx="8" fill="#161b24" stroke="#58c4dd" stroke-width="1.5" /><text x="380" y="386" fill="#58c4dd" font-size="15" text-anchor="middle" font-weight="400" >Multi-Head Self-Attention</text><rect x="270" y="300" width="220" height="40" rx="8" fill="#161b24" stroke="#8b94a7" stroke-width="1.5" /><text x="380" y="326" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >Add & Norm</text><rect x="270" y="240" width="220" height="40" rx="8" fill="#161b24" stroke="#58c4dd" stroke-width="1.5" /><text x="380" y="266" fill="#58c4dd" font-size="15" text-anchor="middle" font-weight="400" >Feed Forward</text><rect x="270" y="180" width="220" height="40" rx="8" fill="#161b24" stroke="#8b94a7" stroke-width="1.5" /><text x="380" y="206" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >Add & Norm</text><line x1="380" y1="540" x2="380" y2="402" stroke="#8b94a7" stroke-width="1.5"  marker-end="url(#arr)"/><line x1="380" y1="180" x2="380" y2="120" stroke="#8b94a7" stroke-width="1.5"  marker-end="url(#arr)"/><circle cx="380" cy="500" r="16" fill="none" stroke="#b189c6" stroke-width="2"/><text x="380" y="506" fill="#b189c6" font-size="20" text-anchor="middle" font-weight="400" >+</text><text x="350" y="506" fill="#b189c6" font-size="15" text-anchor="end" font-weight="400" >PE</text><rect x="290" y="560" width="180" height="40" rx="8" fill="none" stroke="#e6eaf2" stroke-width="1.5" /><text x="380" y="586" fill="#e6eaf2" font-size="15" text-anchor="middle" font-weight="400" >Input Embedding</text><text x="380" y="640" fill="#8b94a7" font-size="16" text-anchor="middle" font-weight="400" >source tokens</text><rect x="710" y="100" width="300" height="320" rx="8" fill="rgba(255,134,47,0.04)" stroke="#ff862f" stroke-width="1.5" /><text x="720" y="90" fill="#ff862f" font-size="18" text-anchor="start" font-weight="650" >Decoder  × 6</text><rect x="750" y="360" width="220" height="40" rx="8" fill="#161b24" stroke="#ff862f" stroke-width="1.5" /><text x="860" y="386" fill="#ff862f" font-size="15" text-anchor="middle" font-weight="400" >Masked Multi-Head Self-Attn</text><rect x="750" y="305" width="220" height="40" rx="8" fill="#161b24" stroke="#8b94a7" stroke-width="1.5" /><text x="860" y="331" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >Add & Norm</text><rect x="750" y="250" width="220" height="40" rx="8" fill="#161b24" stroke="#83c167" stroke-width="1.5" /><text x="860" y="276" fill="#83c167" font-size="15" text-anchor="middle" font-weight="400" >Multi-Head Cross-Attention</text><rect x="750" y="195" width="220" height="40" rx="8" fill="#161b24" stroke="#8b94a7" stroke-width="1.5" /><text x="860" y="221" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >Add & Norm</text><rect x="750" y="140" width="220" height="40" rx="8" fill="#161b24" stroke="#ff862f" stroke-width="1.5" /><text x="860" y="166" fill="#ff862f" font-size="15" text-anchor="middle" font-weight="400" >Feed Forward</text><rect x="750" y="100" width="220" height="40" rx="8" fill="#161b24" stroke="#8b94a7" stroke-width="1.5" /><text x="860" y="126" fill="#8b94a7" font-size="15" text-anchor="middle" font-weight="400" >Add & Norm</text><line x1="860" y1="540" x2="860" y2="402" stroke="#8b94a7" stroke-width="1.5"  marker-end="url(#arr)"/><circle cx="860" cy="500" r="16" fill="none" stroke="#b189c6" stroke-width="2"/><text x="860" y="506" fill="#b189c6" font-size="20" text-anchor="middle" font-weight="400" >+</text><text x="890" y="506" fill="#b189c6" font-size="15" text-anchor="start" font-weight="400" >PE</text><rect x="770" y="560" width="180" height="40" rx="8" fill="none" stroke="#e6eaf2" stroke-width="1.5" /><text x="860" y="586" fill="#e6eaf2" font-size="15" text-anchor="middle" font-weight="400" >Output Embedding</text><text x="860" y="640" fill="#8b94a7" font-size="16" text-anchor="middle" font-weight="400" >target tokens (shifted right by one)</text><path d="M 380 120 L 380 60 L 600 60 L 600 270 L 748 270" fill="none" stroke="#83c167" stroke-width="2" marker-end="url(#arr)"/><text x="610" y="255" fill="#83c167" font-size="15" text-anchor="start" font-weight="400" >K, V</text><text x="985" y="292" fill="#58c4dd" font-size="15" text-anchor="start" font-weight="400" >Q</text><line x1="860" y1="100" x2="860" y2="60" stroke="#8b94a7" stroke-width="1.5"  marker-end="url(#arr)"/><rect x="790" y="20" width="140" height="36" rx="8" fill="none" stroke="#83c167" stroke-width="1.5" /><text x="860" y="44" fill="#83c167" font-size="14" text-anchor="middle" font-weight="400" >Linear + Softmax</text><text x="950" y="44" fill="#8b94a7" font-size="15" text-anchor="start" font-weight="400" >→ next-token probabilities</text><text x="100" y="670" fill="#58c4dd" font-size="15" text-anchor="start" font-weight="400" >① encoder self-attn: source looks at source</text><text x="480" y="670" fill="#ff862f" font-size="15" text-anchor="start" font-weight="400" >② masked self-attn: target looks only at its past</text><text x="900" y="670" fill="#83c167" font-size="15" text-anchor="start" font-weight="400" >③ cross-attn: Q from decoder, K·V from encoder</text><text x="640" y="705" fill="#8b94a7" font-size="14" text-anchor="middle" font-weight="400" >Figure 1 of the paper, redrawn</text></svg>